[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "er2-viser-demo"
version = "0.1.0"
description = "Viser + MuJoCo Franka tabletop demo driven by Gemini Robotics ER 2."
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.3,<4",
  "mink>=1.3,<2",
  "viser>=1.1.1,<2",
  "mjviser==0.0.14",       # 0.0.x API: pinned to the tested release
  "google-genai>=2.24,<3", # needs the Interactions API
  "numpy>=1.26",
  "pillow>=10.1",
  "pydantic>=2.6,<3",
  "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
er2-demo = "er2_demo.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/er2_demo"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
