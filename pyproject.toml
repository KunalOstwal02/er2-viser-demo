[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "er2-viser-demo"
version = "0.1.0"
description = "Viser + MuJoCo Franka tabletop demo driven by Gemini Robotics ER 2."
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.3,<4",
  "mink>=1.3",
  "viser>=1.1,<2",
  "mjviser>=0.0.14",
  "google-genai>=2",
  "numpy",
  "pillow",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
er2-demo = "er2_demo.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/er2_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
